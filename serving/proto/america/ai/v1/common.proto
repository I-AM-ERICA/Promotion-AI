syntax = "proto3";
package america.ai.v1;
option java_multiple_files = true;
option java_package = "com.america.ai.v1";
// Identical wire fields to I-AM-ERICA/am-erica-backend main.
message StoreContext {
  string store_id = 1;
  string name = 2;
  string category = 3;
  string region = 4;
  string address = 5;
}
message Source {
  string title = 1;
  string url = 2;
  string snippet = 3;
  double score = 4;
}
